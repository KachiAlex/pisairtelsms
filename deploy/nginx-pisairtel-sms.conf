# Pisairtel SMS nginx configuration
# Two server blocks on :8082:
#   1. Wildcard per-school subdomains  <slug>.pisairtelsms.com
#      -> injects X-Tenant-Slug so the app can resolve the school at the edge.
#   2. Catch-all (apex / unmatched hosts)
#      -> scrubs any client-supplied X-Tenant-Slug so it can never be spoofed.

server {
    listen 8082;
    server_name ~^(?<slug>[a-z0-9-]+)[.]pisairtelsms[.]com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Trusted origin header for tenant resolution. The resolver only
        # honours it when TRUST_X_TENANT_SLUG=true (i.e. only behind this
        # nginx), and this block is the only one that sets it.
        proxy_set_header X-Tenant-Slug $slug;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 8082 default_server;
    server_name _;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Scrub any client-supplied tenant slug so it can never be spoofed.
        proxy_set_header X-Tenant-Slug "";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}