# =============================================================================
# Nginx Reverse Proxy — Pisairtel Portal + Pisairtel SMS
# =============================================================================

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/x-javascript
  application/json
  application/xml
  application/xml+rss
  application/rss+xml
  application/atom+xml
  image/svg+xml
  font/woff
  font/woff2;

upstream pisairtel_app {
    server app:3000;
}

# HTTP -> HTTPS redirect (all domains)
server {
    listen 80;
    server_name pisairtelsms.com www.pisairtelsms.com pisairtel.com www.pisairtel.com;

    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt;
    }

    return 301 https://$host$request_uri;
}

# =============================================================================
# HTTPS — Pisairtel Portal (pisairtel.com)
# Uses Let's Encrypt cert, proxies to portal container on host port 3001
# =============================================================================

server {
    listen 443 ssl;
    server_name pisairtel.com www.pisairtel.com;

    ssl_certificate /etc/letsencrypt/live/pisairtel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pisairtel.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_PORTAL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://172.18.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
# HTTPS — Pisairtel SMS (pisairtelsms.com)
# Uses existing SSL cert, proxies to SMS app container
# =============================================================================

server {
    listen 443 ssl;
    server_name pisairtelsms.com www.pisairtelsms.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_SMS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Webhook endpoint → host PM2 webhook server
    location /webhook {
        proxy_pass http://172.18.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API requests → Express server
    location /api/ {
        proxy_pass http://pisairtel_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static assets with long cache
    location /assets/ {
        proxy_pass http://pisairtel_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Everything else → SPA frontend
    location / {
        proxy_pass http://pisairtel_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
