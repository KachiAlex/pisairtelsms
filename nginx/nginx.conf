# =============================================================================
# Pisairtel SMS — Nginx Reverse Proxy with SSL
# Routes /api/* to the Express backend, everything else to the frontend
# =============================================================================

upstream pisairtel_app {
    server app:3000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name pisairtelsms.com www.pisairtelsms.com pisairtel.com www.pisairtel.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt;
    }

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name pisairtelsms.com www.pisairtelsms.com pisairtel.com www.pisairtel.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100m;

    # API requests → Express server
    location /api/ {
        proxy_pass http://pisairtel_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static assets with long cache
    location /assets/ {
        proxy_pass http://pisairtel_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else → SPA frontend
    location / {
        proxy_pass http://pisairtel_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
