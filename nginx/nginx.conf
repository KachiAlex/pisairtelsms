# =============================================================================
# Pisairtel SMS — Nginx Reverse Proxy
# Routes /api/* to the Express backend, everything else to the frontend
# =============================================================================

upstream pisairtel_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # API requests → Express server
    location /api/ {
        proxy_pass http://pisairtel_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static assets with long cache
    location /assets/ {
        proxy_pass http://pisairtel_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else → SPA frontend
    location / {
        proxy_pass http://pisairtel_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
