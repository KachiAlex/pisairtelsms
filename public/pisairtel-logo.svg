<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pisairtel SMS logo</title>
<desc>Circular badge logo with a pink-to-orange gradient ring, white inner circle, a red dashboard-window icon containing a graduation cap, the sairtel wordmark, and an SMS tag beneath, signifying a school management software platform.</desc>
<defs>
<linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#F7C93C"/>
<stop offset="28%" stop-color="#F7931E"/>
<stop offset="55%" stop-color="#E8286E"/>
<stop offset="80%" stop-color="#C0208A"/>
<stop offset="100%" stop-color="#8E1FA0"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="600" height="600" fill="#000000"/>

<circle cx="300" cy="280" r="220" fill="url(#ringGrad)"/>
<circle cx="300" cy="280" r="196" fill="#000000"/>
<circle cx="300" cy="280" r="182" fill="#FFFFFF"/>

<g transform="translate(300,190)">
<rect x="-70" y="-52" width="140" height="100" rx="14" fill="none" stroke="#E31E24" stroke-width="8"/>
<circle cx="-52" cy="-34" r="5" fill="#E31E24"/>
<circle cx="-32" cy="-34" r="5" fill="#E31E24"/>
<g transform="scale(0.88)">
<path d="M0 -16 L54 6 L0 28 L-54 6 Z" fill="#E31E24"/>
<path d="M-27 14 L-27 40 C-27 47 -12 53 0 53 C12 53 27 47 27 40 L27 14 L0 26 Z" fill="#E31E24"/>
</g>
</g>

<text x="300" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#E31E24">
<tspan font-style="italic">&#960;</tspan><tspan> sairtel</tspan>
</text>

<rect x="220" y="354" width="160" height="52" rx="26" fill="#E31E24"/>
<text x="300" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#FFFFFF">SMS</text>

</svg>
